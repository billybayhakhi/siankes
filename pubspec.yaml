name: siankes
description: "SIANKES - Sistem Informasi Antrian Klinik"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  percent_indicator: ^4.2.3

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.3
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.3.7

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
